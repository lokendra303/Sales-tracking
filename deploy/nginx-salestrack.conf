# New site for SalesTrack. Do not edit the nginx file of the project already running.
#
# 1. Copy this file to the VPS:
#      sudo cp deploy/nginx-salestrack.conf /etc/nginx/sites-available/salestrack
# 2. Replace both server_name values with names that are not used by the other site.
# 3. If 3000 or 5173 is already taken, change those ports here and in backend/.env and frontend/.env.
# 4. Enable it:
#      sudo ln -s /etc/nginx/sites-available/salestrack /etc/nginx/sites-enabled/salestrack
#      sudo nginx -t && sudo systemctl reload nginx
# 5. HTTPS, after DNS for both names points at this VPS:
#      sudo certbot --nginx -d salestrack.example.com -d api.salestrack.example.com
#
# backend/.env on the VPS:  HOST=127.0.0.1  PORT=3000
# frontend/.env on the VPS, then npm run frontend:build:
#   HOST=127.0.0.1
#   PORT=5173
#   VITE_API_URL=https://api.salestrack.example.com
# mobile/.env for a phone build:
#   EXPO_PUBLIC_API_URL=https://api.salestrack.example.com

server {
    listen 80;
    server_name salestrack.example.com;

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api.salestrack.example.com;

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
