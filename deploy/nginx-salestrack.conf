# Paste these locations inside the existing server { } for your one domain.
# Do not create a second server block and do not change the other project's locations.
#
# yourdomain.com/              existing project
# yourdomain.com/salestrack/   this desk
# yourdomain.com/salestrack-api/   this API
#
# backend/.env: HOST=127.0.0.1 and a free PORT (3001 if the other backend uses 3000)
# frontend/.env before npm run frontend:build:
#   VITE_BASE_PATH=/salestrack
#   VITE_API_URL=https://yourdomain.com/salestrack-api
# mobile/.env:
#   EXPO_PUBLIC_API_URL=https://yourdomain.com/salestrack-api
# The port below must match PORT in backend/.env. The backend serves /api.

location ^~ /salestrack-api/ {
    client_max_body_size 8m;
    proxy_pass http://127.0.0.1:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /salestrack/ {
    root /var/www/salestrack/frontend;
    rewrite ^/salestrack/(.*)$ /dist/$1 break;
    try_files $uri $uri/ @salestrack_app;
}

location @salestrack_app {
    root /var/www/salestrack/frontend/dist;
    try_files /index.html =404;
}
