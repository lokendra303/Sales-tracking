server {
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/kamaxinventory.sepcune.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kamaxinventory.sepcune.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    server_name kamaxinventory.sepcune.com www.kamaxinventory.sepcune.com;

    root /var/www/IMS_Frontend/build;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://localhost:5000/api/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location = /Sales-tracking {
        return 301 /Sales-tracking/;
    }

    location ^~ /Sales-tracking-api/ {
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /Sales-tracking/assets/ {
        alias /var/www/Sales-tracking/frontend/dist/assets/;
    }

    location ^~ /Sales-tracking/ {
        alias /var/www/Sales-tracking/frontend/dist/;
        index index.html;
        try_files $uri $uri/ /Sales-tracking/index.html;
    }

    location = /Sales-tracking/index.html {
        alias /var/www/Sales-tracking/frontend/dist/index.html;
    }
}

server {
    if ($host = kamaxinventory.sepcune.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;

    server_name kamaxinventory.sepcune.com www.kamaxinventory.sepcune.com;
    return 301 https://$host$request_uri;
}
